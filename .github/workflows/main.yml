name: Windows RDP (Bore - IP Pinning + Auto Fix)

on:
  workflow_dispatch:

env:
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup RDP + Users
      shell: powershell
      run: |
        $pass = $env:RDP_PASSWORD
        if ([string]::IsNullOrWhiteSpace($pass)) { $pass = "Root@123456" }

        # runneradmin + runner dono ready karo
        try { Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString $pass -AsPlainText -Force) } catch {}
        try { Set-LocalUser -Name "runneradmin" -PasswordNeverExpires $true } catch {}
        if (-not (Get-LocalUser -Name "runner" -ErrorAction SilentlyContinue)) {
          New-LocalUser -Name "runner" -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -PasswordNeverExpires -ErrorAction SilentlyContinue
        }
        Enable-LocalUser -Name "runner" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "runner" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runner" -ErrorAction SilentlyContinue

        # RDP enable (registry + policy)
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Force | Out-Null
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

        # Firewall
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue

        # Service + verify
        Start-Service -Name TermService -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 3
        netstat -ano | findstr ":3389"
        Write-Host "LOCAL TEST: $((Test-NetConnection -ComputerName localhost -Port 3389).TcpTestSucceeded)"

    - name: Install Bore
      run: |
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

    - name: Bore Tunnel + IP Pin + Self Test + Auto Reconnect
      shell: powershell
      run: |
        $pass = $env:RDP_PASSWORD
        if ([string]::IsNullOrWhiteSpace($pass)) { $pass = "Root@123456" }

        # RDP negotiation packet bhej kar tunnel ka DATA path test karo
        function Test-RdpHost([string]$hostName, [int]$hostPort) {
          $bytes = [byte[]](0x03,0x00,0x00,0x13,0x0e,0xe0,0x00,0x00,0x00,0x00,0x00,0x01,0x00,0x08,0x00,0x03,0x00,0x00,0x00)
          try {
            $client = New-Object System.Net.Sockets.TcpClient
            $task = $client.ConnectAsync($hostName, $hostPort)
            if (-not $task.Wait(8000)) { $client.Close(); return $false }
            $client.ReceiveTimeout = 10000
            $stream = $client.GetStream()
            $stream.WriteTimeout = 5000
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush()
            $buf = New-Object byte[] 8
            $n = $stream.Read($buf, 0, 8)
            $client.Close()
            return ($n -gt 0)
          } catch {
            try { if ($client) { $client.Close() } } catch {}
            return $false
          }
        }

        $attempt = 0
        while ($true) {
          $attempt++
          Write-Host "`n=========================================================="
          Write-Host "  ATTEMPT #$attempt"
          Write-Host "=========================================================="

          $logFile = "$PWD\bore_out.log"
          $errFile = "$PWD\bore_err.log"
          Remove-Item $logFile, $errFile -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath (Join-Path $PWD "bore.exe") `
            -ArgumentList "local","3389","--to","bore.pub" `
            -RedirectStandardOutput $logFile -RedirectStandardError $errFile -PassThru

          $port = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $logFile) {
              $log = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
              if ($log -match "listening at bore\.pub:(\d+)") { $port = $Matches[1]; break }
            }
            if ($proc.HasExited) {
              if (Test-Path $errFile) { Get-Content $errFile }
              break
            }
          }

          if (-not $port) {
            Write-Host "[!] Port nahi mila -> retry"
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Start-Sleep -Seconds 3
            continue
          }

          Write-Host ">>> TUNNEL PORT: $port"
          Write-Host "    USER: runneradmin | PASS: $pass"

          # bore.pub ke SAARE IPs resolve karo (DNS bypass ke liye)
          Write-Host "`n[+] bore.pub ke IPs resolve kar rahe hain..."
          $hosts = @("bore.pub")
          try {
            $ips = Resolve-DnsName bore.pub -Type A -ErrorAction SilentlyContinue |
                   Where-Object { $_.IPAddress } | Select-Object -ExpandProperty IPAddress -Unique
            $hosts += $ips
          } catch {}
          $hosts = $hosts | Select-Object -Unique

          $workingEndpoints = @()
          foreach ($h in $hosts) {
            if (Test-RdpHost $h ([int]$port)) {
              Write-Host "[OK] WORKING ENDPOINT -> $h`:$port"
              $workingEndpoints += "$h`:$port"
            } else {
              Write-Host "[x] FAIL -> $h`:$port"
            }
          }

          if ($workingEndpoints.Count -gt 0) {
            Write-Host "`n=============================================================="
            Write-Host "  mstsc me YE use karo (koi bhi ek):"
            foreach ($ep in $workingEndpoints) { Write-Host "    $ep" }
            Write-Host "  USER: runneradmin"
            Write-Host "  PASS: $pass"
            Write-Host "=============================================================="
            $workingEndpoints | Out-File "$PWD\endpoints.txt"
            "WORKING ENDPOINTS:`n" + ($workingEndpoints -join "`n") + "`nUSER: runneradmin`nPASS: $pass" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            Write-Host "[!] Koi endpoint working nahi -> bore.pub overloaded, naya tunnel..."
            Stop-Process -Id $proc.Id -Force
            Start-Sleep -Seconds 3
            continue
          }

          # Keep alive + auto reconnect
          while (-not $proc.HasExited) { Start-Sleep -Seconds 5 }
          Write-Host "[!] bore connection tut gaya -> naya tunnel bana rahe hain (naya port dekhna)..."
          Start-Sleep -Seconds 3
        }
